[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unofficial-proxmox-mcp"
version = "0.2.0"
description = "Unofficial, drop-in Model Context Protocol (MCP) server for Proxmox VE (QEMU VMs & LXC Containers)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Unofficial Proxmox MCP Contributors" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "proxmox",
    "proxmox-ve",
    "pve",
    "virtualization",
    "qemu",
    "lxc",
    "llm",
    "agent"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "proxmoxer>=2.0.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[project.scripts]
proxmox-mcp = "unofficial_proxmox_mcp.__main__:main"
unofficial-proxmox-mcp = "unofficial_proxmox_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unofficial_proxmox_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
